services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: logitrack-backend

    restart: unless-stopped

    env_file:
      - ./backend/.env

    environment:
      NODE_ENV: production

    volumes:
      - uploads:/app/uploads

    expose:
      - "5000"

    networks:
      - logitrack-network


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: logitrack-frontend

    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      - backend

    networks:
      - logitrack-network


volumes:
  uploads:

networks:
  logitrack-network:
    driver: bridge