services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: logitrack-backend

    restart: unless-stopped

    env_file:
      - ./backend/.env

    environment:
      NODE_ENV: production

    volumes:
      - uploads:/app/uploads

    expose:
      - "5000"

    networks:
      - logitrack-network


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: logitrack-frontend

    restart: unless-stopped

    expose:
      - "80"

    depends_on:
      - backend

    networks:
      - logitrack-network


  caddy:
    image: caddy:2

    container_name: logitrack-caddy

    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

    depends_on:
      - frontend

    networks:
      - logitrack-network


volumes:
  uploads:
  caddy_data:
  caddy_config:

networks:
  logitrack-network:
    driver: bridge